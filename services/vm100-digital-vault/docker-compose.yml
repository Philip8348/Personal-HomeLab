name: digital-vault

services:
  # ===== VAULTWARDEN =====
  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /opt/vaultwarden:/data
    environment:
      ROCKET_PORT: 80
      ROCKET_PROFILE: release
      ROCKET_ADDRESS: 0.0.0.0
      DOMAIN: https://example.home

  # ===== PAPERLESS-NGX =====
  paperless-broker:
    image: docker.io/library/redis:7
    restart: unless-stopped

  paperless-db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes:
      - /opt/paperless/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true"]

  paperless-tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped

  paperless-webserver:
    image: paperless-ngx-nld:latest
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-broker
      - paperless-gotenberg
      - paperless-tika
    ports:
      - "8000:8000"
    volumes:
      - /vault/paperless/data:/usr/src/paperless/data
      - /vault/paperless/media:/usr/src/paperless/media
      - /vault/paperless/export:/usr/src/paperless/export
      - /vault/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      PAPERLESS_DBNAME: paperless
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_OCR_LANGUAGE: nld+eng
      PAPERLESS_URL: https://example.home
      PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
      # ===== AI (Ollama on VM101) =====
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_MODEL: gemma3:4b
      PAPERLESS_AI_LLM_ENDPOINT: http://<lan-ip>:11434
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: nomic-embed-text
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: http://<lan-ip>:11434
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: 120
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: nld
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"
    env_file: paperless.env

  # ===== IMMICH =====
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-db
    ports:
      - "2283:2283"
    volumes:
      - /vault/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    env_file: immich.env

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: unless-stopped
    volumes:
      - /opt/immich/models:/cache
    env_file: immich.env

  immich-redis:
    image: docker.io/library/redis:7
    restart: unless-stopped

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    volumes:
      - /opt/immich/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich

  # ===== GRAMPS WEB =====
  grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    container_name: grampsweb
    restart: unless-stopped
    ports:
      - "8090:5000"
    environment:
      GRAMPSWEB_TREE: "Stamboom"
      GRAMPSWEB_BASE_URL: "https://example.home"
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: "redis://grampsweb_redis:6379/1"
      GRAMPSWEB_DISABLE_TELEMETRY: "true"
    depends_on:
      - grampsweb_redis
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - /vault/gramps/media:/app/media
      - gramps_tmp:/tmp

  grampsweb_celery:
    <<: *grampsweb
    container_name: grampsweb_celery
    ports: []
    healthcheck:
      disable: true
    depends_on:
      grampsweb:
        condition: service_healthy
      grampsweb_redis:
        condition: service_started
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: grampsweb_redis
    restart: unless-stopped

volumes:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_tmp:
