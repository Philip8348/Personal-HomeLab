server {
    listen 80;
    server_name ca.example.home;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ca.example.home;

    ssl_certificate /etc/ssl/local/step-fullchain.crt;
    ssl_certificate_key /etc/ssl/local/step.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root CA download
    location = /cert.crt {
        root /var/www/html;
        try_files /<user>-home-ca.crt =404;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition "attachment; filename=<user>-home-ca.crt";
    }

    # Intermediate CA download
    location = /intermediate.crt {
        root /var/www/html;
        try_files /<user>-home-intermediate.crt =404;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition "attachment; filename=<user>-home-intermediate.crt";
    }

    # Full bundle (root + intermediate)
    location = /ca-bundle.crt {
        root /var/www/html;
        try_files /<user>-home-ca-bundle.crt =404;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition "attachment; filename=<user>-home-ca-bundle.crt";
    }

    # Redirect root to cert download
    location / {
        if ($request_uri = /) {
            return 302 /cert.crt;
        }
        proxy_pass https://<lan-ip>:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
