server {
    listen 80;
    server_name immich.example.home;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name immich.example.home;

    ssl_certificate /etc/ssl/local/step-fullchain.crt;
    ssl_certificate_key /etc/ssl/local/step.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;

    location / {
        proxy_pass http://<lan-ip>:2283;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CORS for Immich Swipe (cross-origin API calls from immich-swipe.example.home)
        set $cors_origin "";
        if ($http_origin = "https://immich-swipe.example.home") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Api-Key, X-Target-Host, User-Agent, Content-Type, Authorization, Range, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
