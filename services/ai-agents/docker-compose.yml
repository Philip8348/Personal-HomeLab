version: "3.8"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_DISABLE_STREAMING: "true"
      OLLAMA_NUM_CTX: "32768"
    volumes:
      - /mnt/4tb/ai-agents/ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - /mnt/4tb/ai-agents/open-webui:/app/backend/data
    depends_on:
      - ollama

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.example.home
      - N8N_HOST=n8n.example.home
      - N8N_PROTOCOL=https
      - N8N_BLOCK_FS_WRITE_ACCESS=false
      - N8N_BLOCK_FS_READ_ACCESS=false
    volumes:
      - /mnt/4tb/n8n:/home/node/.n8n
      - /mnt/4tb/ai-agents:/mnt/4tb/ai-agents
    depends_on:
      - ollama

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    network_mode: host
    shm_size: 1g
    user: "1000:1000"
    volumes:
      - /mnt/4tb/hermes:/opt/data
      - /mnt/4tb/obsidian-vault:/obsidian-vault
      - /mnt/4tb/comfyui/output:/comfyui-output
      - /mnt/4tb/comfyui/config:/comfyui-config
      - /mnt/4tb/comfyui/scripts:/comfyui-scripts
    environment:
      - TZ=Europe/Amsterdam
      - API_SERVER_KEY=ya9Hhy09iuuCwp
      - API_SERVER_HOST=0.0.0.0
      - HOME=/opt/data
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    command: dashboard --host 0.0.0.0 --insecure --no-open --port 9119
    volumes:
      - /mnt/4tb/hermes:/opt/data
    environment:
      - TZ=Europe/Amsterdam
      - GATEWAY_HEALTH_URL=http://127.0.0.1:8642
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: vm109-syncthing
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/4tb/syncthing/config:/var/syncthing/config
      - /mnt/4tb/obsidian-vault:/var/syncthing/obsidian-vault
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
