global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['<lan-ip>:9100']
        labels:
          host: 'pve-epyc'

  - job_name: 'node-vault'
    static_configs:
      - targets: ['<lan-ip>:9100']
        labels:
          host: 'digital-vault'

  - job_name: 'node-monitoring'
    static_configs:
      - targets: ['<lan-ip>:9100']
        labels:
          host: 'monitoring'

  - job_name: 'smartctl'
    static_configs:
      - targets: ['<lan-ip>:9633']
        labels:
          host: 'pve-epyc'

  - job_name: 'ipmi'
    static_configs:
      - targets: ['<lan-ip>:9290']
        labels:
          host: 'pve-epyc'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
